# YOLO-Nano Configuration for Updated Marrakech Dataset
# 6 categories, 23,791 images total

# Model Configuration
model:
  name: "yolo-nano"
  architecture: "nano"
  input_size: [416, 416]
  num_classes: 6  # Updated to match final dataset
  anchors: 3
  depth_multiple: 0.33
  width_multiple: 0.25

# Dataset Configuration
data:
  path: "data/yolo_dataset"
  train: "train/images"
  val: "val/images"
  test: "test/images"
  nc: 6  # number of classes
  names: [
    'JEWELERY',        # 0 - Jewelry (bracelets, diamonds, necklaces, rings)
    'crafts',          # 1 - Traditional handicrafts and pottery
    'lantern',         # 2 - Traditional Moroccan lanterns
    'material_fabric', # 3 - Fabric materials
    'spices',          # 4 - All spices combined (11 types)
    'textile'          # 5 - Carpets and textiles
  ]

# Training Configuration
train:
  epochs: 150        # Increased for large dataset
  batch_size: 32     # Increased for better GPU utilization
  learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 5   # Increased warmup
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
# Data Augmentation (enhanced for large dataset)
augment:
  hsv_h: 0.015      # Hue augmentation
  hsv_s: 0.7        # Saturation augmentation
  hsv_v: 0.4        # Value (brightness) augmentation
  degrees: 15.0     # Rotation degrees
  translate: 0.1    # Translation
  scale: 0.5        # Scale variation
  shear: 2.0        # Shear degrees
  perspective: 0.0  # Perspective transformation
  flipud: 0.0       # Vertical flip probability
  fliplr: 0.5       # Horizontal flip probability
  mosaic: 1.0       # Mosaic augmentation probability
  mixup: 0.1        # MixUp augmentation probability
  copy_paste: 0.1   # Copy-paste augmentation

# Optimization
optimizer:
  name: "AdamW"     # Changed to AdamW for better performance
  lr0: 0.001        # Lower initial learning rate
  lrf: 0.01         # Final learning rate factor
  momentum: 0.937   # SGD momentum (if using SGD)
  weight_decay: 0.0005
  
# Learning Rate Scheduling
lr_scheduler:
  name: "cosine"    # Cosine annealing
  warmup_epochs: 5
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

# Loss Configuration
loss:
  box: 0.05         # Box loss weight
  cls: 0.5          # Classification loss weight
  obj: 1.0          # Objectness loss weight
  anchor_t: 4.0     # Anchor threshold
  fl_gamma: 0.0     # Focal loss gamma (0 = no focal loss)

# Inference Configuration
inference:
  conf_thres: 0.25  # Confidence threshold
  iou_thres: 0.45   # IoU threshold for NMS
  max_det: 1000     # Maximum detections per image
  agnostic_nms: False  # Class-agnostic NMS

# Hardware Configuration
device:
  gpu: True         # Use GPU if available
  workers: 8        # Increased workers for large dataset
  
# Logging and Checkpoints
logging:
  project: "runs/train"
  name: "yolo_nano_marrakech_v2"
  save_period: 25   # Save checkpoint every 25 epochs
  log_imgs: 32      # Number of images to log
  
# Validation Configuration
val:
  save_json: True   # Save validation results as JSON
  save_hybrid: False # Save hybrid labels
  conf_thres: 0.001 # Confidence threshold for validation
  iou_thres: 0.6    # IoU threshold for validation
  plots: True       # Generate validation plots

# Early Stopping
early_stopping:
  patience: 50      # Stop if no improvement for 50 epochs
  min_delta: 0.001  # Minimum change to qualify as improvement

# Model EMA (Exponential Moving Average)
ema:
  enabled: True
  decay: 0.9999
  tau: 2000