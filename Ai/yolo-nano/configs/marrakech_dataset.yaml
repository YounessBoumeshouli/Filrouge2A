# YOLO-Nano Configuration for Marrakech Dataset
# Updated to match current dataset structure

# Model Configuration
model:
  name: "yolo-nano"
  architecture: "nano"
  input_size: [416, 416]
  num_classes: 8  # Updated based on current dataset
  anchors: 3
  depth_multiple: 0.33
  width_multiple: 0.25

# Dataset Configuration (will be updated by prepare_yolo_dataset.py)
data:
  path: "data/yolo_dataset"  # Will be set by dataset preparation script
  train: "train/images"
  val: "val/images"
  test: "test/images"
  nc: 8  # number of classes
  names: [
    'argan',        # 0 - Argan oil and cosmetic products
    'crafts',       # 1 - Traditional handicrafts and pottery  
    'jewelry',      # 2 - Berber and Moroccan jewelry
    'lanterns',     # 3 - Traditional Moroccan lighting
    'leather',      # 4 - Leather goods and babouches
    'price_tags',   # 5 - Price reference detection
    'spices',       # 6 - Traditional spices and herbs
    'textiles'      # 7 - Carpets, fabrics, and clothing
  ]

# Training Configuration
train:
  epochs: 100
  batch_size: 16
  learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
# Data Augmentation
augment:
  hsv_h: 0.015      # Hue augmentation
  hsv_s: 0.7        # Saturation augmentation
  hsv_v: 0.4        # Value (brightness) augmentation
  degrees: 10.0     # Rotation degrees
  translate: 0.1    # Translation
  scale: 0.5        # Scale variation
  shear: 2.0        # Shear degrees
  perspective: 0.0  # Perspective transformation
  flipud: 0.0       # Vertical flip probability
  fliplr: 0.5       # Horizontal flip probability
  mosaic: 1.0       # Mosaic augmentation probability
  mixup: 0.0        # MixUp augmentation probability

# Optimization
optimizer:
  name: "SGD"
  lr0: 0.01         # Initial learning rate
  lrf: 0.01         # Final learning rate factor
  momentum: 0.937   # SGD momentum
  weight_decay: 0.0005  # Weight decay

# Loss Configuration
loss:
  box: 0.05         # Box loss weight
  cls: 0.5          # Classification loss weight
  obj: 1.0          # Objectness loss weight
  anchor_t: 4.0     # Anchor threshold

# Inference Configuration
inference:
  conf_thres: 0.25  # Confidence threshold
  iou_thres: 0.45   # IoU threshold for NMS
  max_det: 1000     # Maximum detections per image
  agnostic_nms: False  # Class-agnostic NMS

# Hardware Configuration
device:
  gpu: True         # Use GPU if available
  workers: 4        # Number of data loading workers
  
# Logging and Checkpoints
logging:
  project: "runs/train"
  name: "yolo_nano_marrakech"
  save_period: 10   # Save checkpoint every N epochs
  log_imgs: 16      # Number of images to log
  
# Validation Configuration
val:
  save_json: True   # Save validation results as JSON
  save_hybrid: False # Save hybrid labels
  conf_thres: 0.001 # Confidence threshold for validation
  iou_thres: 0.6    # IoU threshold for validation