# YOLO-Nano Configuration for Marrakech Detection

# Model Configuration
model:
  name: "yolo-nano"
  architecture: "nano"
  input_size: [416, 416]
  num_classes: 17  # 10 monuments + 7 products
  anchors: 3
  depth_multiple: 0.33
  width_multiple: 0.25

# Dataset Configuration
data:
  path: "data/yolo_dataset"  # Updated to correct path
  train: "train/images"
  val: "val/images"
  test: "test/images"
  nc: 6  # Updated to match actual dataset
  names: [
    # Product classes (0-5) - matching actual dataset
    'JEWELERY', 'crafts', 'lantern', 'material_fabric', 'spices', 'textile'
  ]

# Training Configuration
train:
  epochs: 100
  batch_size: 16
  learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.001  # Increased from 0.0005 for better regularization
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  dropout_rate: 0.2  # Added dropout rate
  early_stopping: true
  patience: 10
  
# Augmentation
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

# Optimization
optimizer:
  name: "SGD"
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

# Loss weights
loss:
  box: 0.05
  cls: 0.5
  obj: 1.0

# Inference
inference:
  conf_thres: 0.25
  iou_thres: 0.45
  max_det: 1000
  agnostic_nms: False