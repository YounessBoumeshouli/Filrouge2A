global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rag_backend"
    static_configs:
      - targets: ["rag_backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    
  - job_name: "main_backend"
    static_configs:
      - targets: ["main_backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s